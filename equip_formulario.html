<!doctype html>
<html lang="pt-br">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>QRManut - Busca Geral de Ativos</title>

<style>

* {
  box-sizing:border-box;
}

body {

  margin:0;

  background:#f5f7fa;

  color:#111827;

  font-family:
    system-ui,
    -apple-system,
    Segoe UI,
    Roboto,
    Arial,
    sans-serif;
}


.container {

  max-width:900px;

  margin:auto;

  padding:20px;
}


.header {

  margin-bottom:20px;
}


.logo {

  font-size:1.45rem;

  font-weight:800;

  color:#1f4e78;
}


.subtitulo {

  color:#6b7280;

  margin-top:4px;
}


.card {

  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:16px;

  padding:18px;

  box-shadow:
    0 5px 14px
    rgba(0,0,0,.05);
}


.search-box {

  display:flex;

  gap:8px;
}


.search-box input {

  flex:1;

  min-width:0;

  border:
    1px solid
    #d1d5db;

  border-radius:12px;

  padding:14px;

  font-size:1rem;

  outline:none;
}


.search-box input:focus {

  border-color:#1f4e78;

  box-shadow:
    0 0 0 2px
    rgba(31,78,120,.1);
}


.search-box button {

  border:0;

  border-radius:12px;

  background:#1f4e78;

  color:#fff;

  font-weight:700;

  padding:0 20px;

  cursor:pointer;
}


.search-box button:disabled {

  opacity:.6;

  cursor:not-allowed;
}


.ajuda {

  margin-top:10px;

  color:#6b7280;

  font-size:.85rem;
}


#status {

  margin-top:18px;

  color:#6b7280;

  font-size:.9rem;
}


.resultados {

  margin-top:16px;

  display:grid;

  gap:12px;
}


.ativo {

  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:14px;

  padding:15px;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.03);
}


.ativo-topo {

  display:flex;

  justify-content:space-between;

  gap:12px;

  align-items:flex-start;
}


.ativo-id {

  font-size:.8rem;

  font-weight:800;

  color:#1f4e78;

  margin-bottom:3px;
}


.ativo-nome {

  font-size:1rem;

  font-weight:700;
}


.tipo {

  background:#eef2ff;

  color:#3730a3;

  border-radius:999px;

  padding:5px 9px;

  font-size:.72rem;

  font-weight:700;

  white-space:nowrap;
}


.status-ativo {

  display:inline-block;

  margin-top:7px;

  padding:4px 8px;

  border-radius:999px;

  font-size:.72rem;

  border:1px solid #d1d5db;

  background:#f9fafb;
}


.dados {

  margin-top:11px;

  font-size:.88rem;

  color:#4b5563;

  line-height:1.6;
}


.acoes {

  margin-top:13px;

  padding-top:12px;

  border-top:
    1px solid
    #f0f0f0;
}


.btn-abrir {

  display:block;

  width:100%;

  text-align:center;

  background:#1f4e78;

  color:#fff;

  text-decoration:none;

  border-radius:9px;

  padding:11px;

  font-weight:700;
}


.vazio {

  background:#fff;

  padding:22px;

  border-radius:12px;

  text-align:center;

  color:#6b7280;

  border:
    1px solid
    #e5e7eb;
}


.footer {

  margin-top:24px;

  text-align:center;

  color:#9ca3af;

  font-size:.75rem;
}


@media(max-width:600px) {

  .search-box {
    display:grid;
  }


  .search-box button {
    padding:13px;
  }


  .ativo-topo {
    display:block;
  }


  .tipo {

    display:inline-block;

    margin-top:7px;
  }
}

</style>

</head>


<body>


<div class="container">


<div class="header">

<div class="logo">
🔎 QRManut
</div>

<div class="subtitulo">
Busca geral de equipamentos, ambientes e ativos
</div>

</div>


<div class="card">


<div class="search-box">

<input
  id="busca"
  type="search"
  placeholder="Digite ID, equipamento, ambiente ou localização..."
  autocomplete="off"
>

<button
  id="btnBuscar"
  type="button"
>
Buscar
</button>

</div>


<div class="ajuda">

Você pode pesquisar por:

<strong>
ID, equipamento, ambiente, pavimento, localização, fabricante ou modelo.
</strong>

<br><br>

Exemplos:
Microbiologia, 2º Piso, Recepção, Bomba, Dancor ou EQ001BH1P.

</div>

</div>


<div id="status"></div>


<div
  id="resultados"
  class="resultados"
></div>


<div class="footer">

QRManut • Sistema de Gestão de Manutenção<br>

JCPG-2026 - Busca v1.0

</div>


</div>


<script>


/* ============================================================
   CONFIGURAÇÃO
   ============================================================ */

const API_URL =
"https://script.google.com/macros/s/AKfycbx4tpC42Q6WdkNhTUTAGoZWvG5M24zwlNscnwbDP5B3Q5pWo8B32-Lf0rQ2Xtua1AFMAQ/exec";


const API_TOKEN =
"pncqalpha123";


/*
 * IMPORTANTE
 *
 * Esta página considera que o HTML da ficha
 * principal está no arquivo index.html.
 *
 * Se o nome do arquivo for diferente,
 * altere somente esta constante.
 */

const FICHA_URL =
"index.html";


/* ============================================================
   ELEMENTOS
   ============================================================ */

const busca =
  document.getElementById(
    "busca"
  );


const btnBuscar =
  document.getElementById(
    "btnBuscar"
  );


const statusEl =
  document.getElementById(
    "status"
  );


const resultados =
  document.getElementById(
    "resultados"
  );


/* ============================================================
   SEGURANÇA HTML
   ============================================================ */

function esc(texto) {

  return String(
    texto ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}


/* ============================================================
   EXECUTA BUSCA
   ============================================================ */

async function executarBusca() {

  const termo =
    busca.value.trim();


  resultados.innerHTML =
    "";


  if (
    termo.length < 2
  ) {

    statusEl.textContent =
      "Digite pelo menos 2 caracteres.";

    busca.focus();

    return;
  }


  statusEl.textContent =
    "Buscando ativos...";


  btnBuscar.disabled =
    true;


  try {


    const url =

      API_URL +

      "?action=search" +

      "&q=" +

      encodeURIComponent(
        termo
      ) +

      "&token=" +

      encodeURIComponent(
        API_TOKEN
      );


    const response =
      await fetch(
        url
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Erro HTTP " +
        response.status
      );
    }


    const json =
      await response.json();


    if (
      !json.ok
    ) {

      throw new Error(
        json.detail ||
        json.error ||
        "Erro na busca."
      );
    }


    renderizarResultados(
      json.results || []
    );


  } catch (
    erro
  ) {

    console.error(
      erro
    );


    statusEl.textContent =
      "Não foi possível realizar a busca.";


    resultados.innerHTML = `

      <div class="vazio">

        Ocorreu um erro ao consultar o QRManut.

      </div>

    `;


  } finally {

    btnBuscar.disabled =
      false;
  }
}


/* ============================================================
   RENDERIZA RESULTADOS
   ============================================================ */

function renderizarResultados(lista) {

  resultados.innerHTML =
    "";


  if (
    lista.length === 0
  ) {

    statusEl.textContent =
      "";


    resultados.innerHTML = `

      <div class="vazio">

        Nenhum ativo encontrado.

      </div>

    `;


    return;
  }


  statusEl.textContent =

    lista.length +

    (
      lista.length === 1
        ? " resultado encontrado"
        : " resultados encontrados"
    );


  lista.forEach(
    function(item) {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "ativo";


      let dados =
        "";


      if (
        item.pavimento
      ) {

        dados += `

          <div>

            📍

            <b>
              Pavimento:
            </b>

            ${esc(
              item.pavimento
            )}

          </div>

        `;
      }


      if (
        item.localizacao
      ) {

        dados += `

          <div>

            <b>
              Localização:
            </b>

            ${esc(
              item.localizacao
            )}

          </div>

        `;
      }


      if (

        item.ambiente &&

        item.ambiente !==
        item.localizacao

      ) {

        dados += `

          <div>

            <b>
              Ambiente:
            </b>

            ${esc(
              item.ambiente
            )}

          </div>

        `;
      }


      if (
        item.fabricante
      ) {

        dados += `

          <div>

            <b>
              Fabricante:
            </b>

            ${esc(
              item.fabricante
            )}

          </div>

        `;
      }


      if (
        item.modelo
      ) {

        dados += `

          <div>

            <b>
              Modelo:
            </b>

            ${esc(
              item.modelo
            )}

          </div>

        `;
      }


      if (
        item.categoria
      ) {

        dados += `

          <div>

            <b>
              Categoria:
            </b>

            ${esc(
              item.categoria
            )}

          </div>

        `;
      }


      if (
        item.criticidade
      ) {

        dados += `

          <div>

            <b>
              Criticidade:
            </b>

            ${esc(
              item.criticidade
            )}

          </div>

        `;
      }


      const ficha =

        FICHA_URL +

        "?id=" +

        encodeURIComponent(
          item.id
        );


      card.innerHTML = `

        <div class="ativo-topo">


          <div>


            <div class="ativo-id">

              ${esc(
                item.id
              )}

            </div>


            <div class="ativo-nome">

              ${esc(
                item.nome ||
                "Sem descrição"
              )}

            </div>


            ${
              item.status
                ? `

                  <span class="status-ativo">

                    ${esc(
                      item.status
                    )}

                  </span>

                `
                : ""
            }


          </div>


          <span class="tipo">

            ${esc(
              item.tipo ||
              "Ativo"
            )}

          </span>


        </div>


        <div class="dados">

          ${dados}

        </div>


        <div class="acoes">

          <a
            class="btn-abrir"
            href="${ficha}"
          >

            Abrir ficha do ativo

          </a>

        </div>

      `;


      resultados.appendChild(
        card
      );

    }
  );
}


/* ============================================================
   EVENTOS
   ============================================================ */

btnBuscar.addEventListener(
  "click",
  executarBusca
);


busca.addEventListener(

  "keydown",

  function(event) {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      executarBusca();
    }
  }
);


/* ============================================================
   BUSCA AUTOMÁTICA VIA URL
 *
 * Exemplo:
 *
 * buscar.html?q=microbiologia
 * ============================================================ */

const parametros =
  new URLSearchParams(
    window.location.search
  );


const termoInicial =
  parametros.get(
    "q"
  );


if (
  termoInicial &&
  termoInicial.length >= 2
) {

  busca.value =
    termoInicial;


  executarBusca();

} else {

  busca.focus();
}


</script>

</body>

</html>
