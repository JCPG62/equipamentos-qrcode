<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ficha do Equipamento (QRManut + API)</title>

  <style>
    :root { --gap:16px; }

    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;
      max-width:960px;
      margin:auto;
      padding:var(--gap);
      background:#f8f9fb;
    }

    .card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:var(--gap);
      box-shadow:0 6px 16px rgba(0,0,0,.05);
    }

    h1{
      font-size:1.25rem;
      margin:0 0 4px 0;
    }

    .muted{
      color:#6b7280;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:var(--gap);
      margin-top:var(--gap);
    }

    @media (max-width:780px){
      .grid{
        grid-template-columns:1fr;
      }
    }

    .chip{
      display:inline-block;
      border:1px solid #e5e7eb;
      border-radius:999px;
      padding:6px 10px;
      margin-right:6px;
      text-decoration:none;
      color:#111827;
      cursor:pointer;
      background:#fff;
    }

    .empty{
      color:#9ca3af;
    }

    .kv{
      display:block;
      margin-top:6px;
    }

    .kv .pair{
      padding:8px 0;
      border-bottom:1px dashed #eee;
      line-height:1.35;
    }

    .kv .pair:last-child{
      border-bottom:0;
    }

    .kv .pair b{
      font-weight:600;
      margin-right:6px;
      white-space:nowrap;
    }

    .kv .pair span{
      word-break:break-word;
      overflow-wrap:anywhere;
    }

    .kv .pair.modelo b{
      display:block;
      margin:0 0 4px 0;
    }

    .kv .pair.modelo span{
      display:block;
    }

    .footer{
      margin-top:var(--gap);
      font-size:.9rem;
      color:#6b7280;
    }

    #modal-anomalia{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }

    #modal-anomalia .box{
      background:#fff;
      width:min(680px,90vw);
      border-radius:14px;
      padding:16px;
      border:1px solid #e5e7eb;
      box-shadow:0 10px 30px rgba(0,0,0,.15);
    }

    .row{
      display:grid;
      gap:12px;
    }

    label{
      display:grid;
      gap:6px;
    }

    input[type="text"],
    textarea{
      width:100%;
      padding:12px;
      border:1px solid #e5e7eb;
      border-radius:10px;
      font:inherit;
      box-sizing:border-box;
    }

    textarea{
      resize:vertical;
    }

    button{
      padding:12px 16px;
      border:0;
      border-radius:10px;
      background:#111827;
      color:#fff;
      cursor:pointer;
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .btn-secondary{
      background:#e5e7eb;
      color:#111827;
    }

    #status-reporte{
      display:none;
      margin-top:10px;
      padding:10px;
      border-radius:8px;
      font-size:.9rem;
    }

    .status-loading{
      display:block !important;
      background:#fef3c7;
      color:#92400e;
    }

    .status-success{
      display:block !important;
      background:#d1fae5;
      color:#065f46;
    }

    .status-error{
      display:block !important;
      background:#fee2e2;
      color:#991b1b;
    }

    #postFrame{
      display:none;
      width:0;
      height:0;
      border:0;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1 id="titulo">Carregando…</h1>

    <div id="meta" class="muted"></div>

    <div class="grid">

      <div>

        <h3>Características</h3>
        <div id="carac" class="kv"></div>

        <h3>Plano Preventivo</h3>
        <div id="pp" class="empty">
          Periodicidade • Próxima Manutenção
        </div>

        <h3>Localização</h3>
        <div id="localizacao" class="empty">-</div>

      </div>

      <div>

        <h3>Responsável / Prestador</h3>
        <div id="resp" class="empty">-</div>

      </div>

    </div>

    <p style="margin-top:16px">
      <a id="reportar" class="chip">
        Reportar Serviço/Anomalia/Reparo
      </a>
    </p>

    <p style="font-size:7px;">
      JCPG-2026 - Ver.:1.5
    </p>

    <div class="footer" id="ft"></div>

  </div>


  <!-- ======================================================
       MODAL
       ====================================================== -->

  <div id="modal-anomalia">

    <div class="box">

      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">

        <h2 style="margin:0;font-size:1.1rem">
          Reportar Serviço, Anomalia ou Reparo
        </h2>

        <button
          type="button"
          class="btn-secondary"
          id="fechar-modal">
          Fechar
        </button>

      </div>


      <div class="row" style="margin-top:12px">

        <label>
          <span>Seu nome *</span>
          <input
            id="nome"
            type="text"
            required
            autocomplete="name">
        </label>

        <label>
          <span>Contato (e-mail ou telefone)</span>
          <input
            id="contato"
            type="text"
            autocomplete="email tel">
        </label>

        <label>
          <span>Descrição do Serviço, Anomalia ou Reparo *</span>
          <textarea
            id="descricao"
            rows="5"
            required
            placeholder="Explique o ocorrido, serviço realizado, sintomas, quando começou…"></textarea>
        </label>

        <div id="status-reporte"></div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">

          <button
            type="button"
            class="btn-secondary"
            id="cancelar-modal">
            Cancelar
          </button>

          <button
            type="button"
            id="btn-enviar">
            Enviar
          </button>

        </div>

      </div>

      <p style="margin-top:10px;color:#6b7280;font-size:.9rem">
        O reporte será enviado automaticamente ao responsável pela manutenção.
      </p>

    </div>

  </div>


  <!-- ======================================================
       FORMULÁRIO POST NATIVO INVISÍVEL
       ====================================================== -->

  <form
    id="nativePostForm"
    method="POST"
    target="postFrame"
    style="display:none;">

    <input type="hidden" name="token" id="post_token">
    <input type="hidden" name="id" id="post_id">
    <input type="hidden" name="nomeEquipamento" id="post_nomeEquipamento">
    <input type="hidden" name="reportadoPor" id="post_reportadoPor">
    <input type="hidden" name="contato" id="post_contato">
    <input type="hidden" name="descricao" id="post_descricao">

  </form>

  <iframe
    id="postFrame"
    name="postFrame">
  </iframe>


<script>

/* ============================================================
   CONFIGURAÇÃO
   ============================================================ */

const API_URL =
"https://script.google.com/macros/s/AKfycbx7K_63QoHC_F8kR3X8NczNlkLNxebsmivoxDq1LEpgBRsvTqGnPGYxqUB2JqiiW2mkZg/exec";

const API_TOKEN =
"pncqalpha123";

const DEFAULT_MAIL =
"manutencao@pncq.org.br";


/* ============================================================
   ESTADO
   ============================================================ */

let postEmAndamento = false;
let postTimer = null;


/* ============================================================
   HELPERS
   ============================================================ */

function qs(k){
  return new URLSearchParams(location.search).get(k);
}

function el(s){
  return document.querySelector(s);
}

function esc(s){
  return (s || "")
    .toString()
    .replace(/[&<>]/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;"
    }[c]));
}

function formatDateBR(s){

  const v =
    String(s || "").trim();

  if(!v){
    return "";
  }

  const iso =
    v.match(/^(\d{4})-(\d{2})-(\d{2})/);

  if(iso){
    return `${iso[3]}/${iso[2]}/${iso[1]}`;
  }

  return v;
}


/* ============================================================
   CONSULTA EQUIPAMENTO
   ============================================================ */

async function fetchEquipById(id){

  const url =
    `${API_URL}?id=${encodeURIComponent(id)}&token=${encodeURIComponent(API_TOKEN)}`;

  const response =
    await fetch(url);

  if(!response.ok){
    throw new Error(
      "Erro HTTP " +
      response.status
    );
  }

  const json =
    await response.json();

  if(!json.ok){
    throw new Error(
      json.error ||
      "Erro na API"
    );
  }

  return json.data;
}


/* ============================================================
   RENDERIZAÇÃO
   ============================================================ */

function render(eq){

  if(!eq){
    el("#titulo").textContent =
      "Ativo não encontrado";
    return;
  }

  const id =
    eq.id || "";

  const nome =
    eq.nome_do_equipamento || "";

  window.__EQUIP_ID__ =
    id;

  window.__EQUIP_NOME__ =
    nome;

  window.__MAIL_DEST__ =
    eq.email_fonte ||
    DEFAULT_MAIL;

  el("#titulo").textContent =
    (id || "Equipamento") +
    (nome ? " – " + nome : "");

  el("#meta").innerHTML =
    [
      eq.fabricante,
      eq.modelo
    ]
    .filter(Boolean)
    .map(esc)
    .join("<br>");


  const pares = [

    {
      rotulo:"Fabricante",
      valor:eq.fabricante,
      classe:""
    },

    {
      rotulo:"Modelo",
      valor:eq.modelo,
      classe:"modelo"
    },

    {
      rotulo:"Capacidade",
      valor:eq.capacidade,
      classe:""
    },

    {
      rotulo:"Amperagem Nominal (FLA)",
      valor:eq.amperagem_nominal_fla,
      classe:""
    },

    {
      rotulo:"Voltagem",
      valor:eq.voltagem,
      classe:""
    }

  ];


  const caracHTML =
    pares
      .filter(
        p =>
          p.valor &&
          p.valor !== "-"
      )
      .map(
        p => `
          <div class="pair ${p.classe || ""}">
            <b>${esc(p.rotulo)}:</b>
            ${p.classe === "modelo" ? "<br>" : " "}
            <span>${esc(p.valor)}</span>
          </div>
        `
      )
      .join("")
      ||
      "<div class='empty'>Sem dados</div>";

  el("#carac").innerHTML =
    caracHTML;


  const pp = [];

  if(eq.periodicidade){

    pp.push(
      "<b>Periodicidade:</b> " +
      esc(eq.periodicidade)
    );
  }

  if(eq.proxima_manutencao){

    pp.push(
      "<b>Próxima:</b> " +
      esc(
        formatDateBR(
          eq.proxima_manutencao
        )
      )
    );
  }

  el("#pp").innerHTML =
    pp.join("<br>")
    ||
    "<span class='empty'>-</span>";

  el("#localizacao").textContent =
    eq.localizacao || "-";

  el("#resp").textContent =
    eq.prestador || "-";

  el("#ft").innerHTML =
    "Última atualização: " +
    new Date().toLocaleString() +
    "<br>" +
    "<span class='muted'>" +
    "Reportes serão enviados automaticamente ao responsável pela manutenção." +
    "</span>";
}


/* ============================================================
   MODAL
   ============================================================ */

function abrirModal(){

  const status =
    el("#status-reporte");

  status.className = "";
  status.textContent = "";

  el("#modal-anomalia").style.display =
    "flex";
}


function fecharModal(){

  el("#modal-anomalia").style.display =
    "none";
}


/* ============================================================
   LIMPA FORMULÁRIO VISÍVEL
   ============================================================ */

function limparFormularioReporte(){

  el("#nome").value =
    "";

  el("#contato").value =
    "";

  el("#descricao").value =
    "";
}


/* ============================================================
   CONFIRMAÇÃO DE ENVIO
   ============================================================ */

function finalizarEnvioVisual(){

  const status =
    el("#status-reporte");

  const btn =
    el("#btn-enviar");

  status.className =
    "status-success";

  status.textContent =
    "Reporte enviado para processamento.";

  btn.disabled =
    false;

  btn.textContent =
    "Enviar";

  limparFormularioReporte();

  postEmAndamento =
    false;

  if(postTimer){
    clearTimeout(postTimer);
    postTimer = null;
  }

  setTimeout(
    function(){
      fecharModal();
    },
    1800
  );
}


/* ============================================================
   ENVIO NATIVO
   ============================================================ */

function enviarReporte(){

  const nome =
    el("#nome").value.trim();

  const contato =
    el("#contato").value.trim();

  const descricao =
    el("#descricao").value.trim();

  const status =
    el("#status-reporte");

  const btn =
    el("#btn-enviar");


  if(!nome){

    status.className =
      "status-error";

    status.textContent =
      "Informe seu nome.";

    return;
  }


  if(!descricao){

    status.className =
      "status-error";

    status.textContent =
      "Informe a descrição.";

    return;
  }


  if(!window.__EQUIP_ID__){

    status.className =
      "status-error";

    status.textContent =
      "Equipamento não identificado.";

    return;
  }


  /* ==========================================
     PREENCHE FORMULÁRIO INVISÍVEL
     ========================================== */

  el("#post_token").value =
    API_TOKEN;

  el("#post_id").value =
    window.__EQUIP_ID__;

  el("#post_nomeEquipamento").value =
    window.__EQUIP_NOME__ || "";

  el("#post_reportadoPor").value =
    nome;

  el("#post_contato").value =
    contato;

  el("#post_descricao").value =
    descricao;


  /* URL DO APPS SCRIPT */

  const form =
    el("#nativePostForm");

  form.action =
    API_URL;


  /* ==========================================
     VISUAL
     ========================================== */

  btn.disabled =
    true;

  btn.textContent =
    "Enviando...";

  status.className =
    "status-loading";

  status.textContent =
    "Enviando reporte...";

  postEmAndamento =
    true;


  /* ==========================================
     ENVIA POST NATIVO
     ========================================== */

  form.submit();


  /*
   * Como a resposta ocorre dentro do iframe,
   * aguardamos o evento load.
   *
   * Existe também um fallback de 5 segundos.
   */

  postTimer =
    setTimeout(
      function(){

        if(postEmAndamento){
          finalizarEnvioVisual();
        }

      },
      5000
    );
}


/* ============================================================
   EVENTO DO IFRAME
   ============================================================ */

el("#postFrame")
  .addEventListener(
    "load",
    function(){

      /*
       * O iframe também possui um carregamento inicial.
       * Só tratamos como envio quando postEmAndamento=true.
       */

      if(postEmAndamento){

        /*
         * Pequeno atraso para garantir que o Apps Script
         * terminou a execução.
         */

        setTimeout(
          finalizarEnvioVisual,
          500
        );
      }
    }
  );


/* ============================================================
   EVENTOS DA TELA
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    el("#reportar").onclick =
      abrirModal;

    el("#fechar-modal").onclick =
      fecharModal;

    el("#cancelar-modal").onclick =
      fecharModal;

    el("#btn-enviar").onclick =
      enviarReporte;


    el("#modal-anomalia")
      .addEventListener(
        "click",
        function(event){

          if(
            event.target.id ===
            "modal-anomalia"
          ){
            fecharModal();
          }
        }
      );
  }
);


/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */

async function main(){

  const id =
    qs("id");


  if(!id){

    el("#titulo").textContent =
      "Sem ID na URL";

    return;
  }


  try{

    const equipamento =
      await fetchEquipById(id);

    render(
      equipamento
    );

  }
  catch(error){

    console.error(error);

    el("#titulo").textContent =
      "Erro ao carregar dados";

    el("#meta").textContent =
      error.message;
  }
}


main();

</script>

</body>
</html>
